<svg width="340" height="96" viewBox="0 0 340 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Accent Bar -->
  <rect x="0" y="8" width="24" height="80" fill="#2EA3DC"/>

  <g transform="translate(32, 0)">
    <!-- Q Outer Ring -->
    <ellipse cx="44" cy="46" rx="31" ry="32" stroke="#2EA3DC" stroke-width="6" fill="none"/>
    
    <!-- Q Dynamic Tail Swoop -->
    <path d="M 32 52 C 34 68, 48 80, 62 81 C 68 81.5, 73 79, 75 75" 
          stroke="#2EA3DC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- ODES Wordmark -->
    <text x="88" y="56" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" fill="#2EA3DC" font-size="40" letter-spacing="2px">ODES</text>

    <!-- Horizontal Divider Line Under ODES -->
    <line x1="88" y1="65" x2="238" y2="65" stroke="#2EA3DC" stroke-width="2" stroke-linecap="round"/>

    <!-- Systems Subtitle -->
    <text x="89" y="85" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="500" fill="#475569" font-size="19" letter-spacing="0.5px">Systems</text>
  </g>

  <!-- Right Accent Bar -->
  <rect x="316" y="8" width="24" height="80" fill="#2EA3DC"/>
</svg>
