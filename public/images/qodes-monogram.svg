<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .q-stroke { stroke: #0284C7; }
    .s-stroke { stroke: #0F172A; }
    @media (prefers-color-scheme: dark) {
      .q-stroke { stroke: #38BDF8; }
      .s-stroke { stroke: #FFFFFF; }
    }
  </style>

  <!-- Q (Top-Left): Chunky Squircle with 45° Diagonal Spur -->
  <rect 
    x="6" 
    y="6" 
    width="19" 
    height="19" 
    rx="6" 
    class="q-stroke"
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
  <line 
    x1="18" 
    y1="18" 
    x2="25" 
    y2="25" 
    class="q-stroke"
    stroke-width="4.5" 
    stroke-linecap="round" 
  />

  <!-- S (Bottom-Right): Clean, Unmistakable 2-Curve S Flow -->
  <path 
    d="M 40 23.5 H 30 C 25 23.5 25 29.5 29.5 29.5 H 35 C 39.5 29.5 39.5 36 34.5 36 H 25.5" 
    class="s-stroke"
    stroke-width="4.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
