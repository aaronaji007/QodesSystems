<svg width="280" height="96" viewBox="0 0 280 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .odes-title {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 600;
        fill: #2EA3DC;
        letter-spacing: 2px;
      }
      .systems-sub {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        font-weight: 500;
        fill: #475569;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Q Outer Ring -->
  <ellipse cx="44" cy="46" rx="31" ry="32" stroke="#2EA3DC" stroke-width="6" fill="none"/>
  
  <!-- Q Dynamic Tail Swoop -->
  <path d="M 32 52 C 34 68, 48 80, 62 81 C 68 81.5, 73 79, 75 75" 
        stroke="#2EA3DC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ODES Wordmark -->
  <text x="88" y="56" class="odes-title" font-size="40" font-weight="600">ODES</text>

  <!-- Horizontal Divider Line Under ODES -->
  <line x1="88" y1="65" x2="238" y2="65" stroke="#2EA3DC" stroke-width="2" stroke-linecap="round"/>

  <!-- Systems Subtitle (replacing Technologies) -->
  <text x="89" y="85" class="systems-sub" font-size="19" font-weight="500">Systems</text>
</svg>
